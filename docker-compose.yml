services:
  app:
    build: .
    container_name: berimbau_app
    ports:
      - "${APP_PORT:-9077}:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.4
    container_name: berimbau_mysql
    ports:
      - "${DB_PORT:-3377}:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-sistema_capoeira}
    volumes:
      - db_data:/var/lib/mysql
      - ./sistema_capoeira.sql:/docker-entrypoint-initdb.d/01-sistema-capoeira.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
